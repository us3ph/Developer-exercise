$kind: http-request
url: "{{base_url}}/webhooks/whatsapp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "from": "+212 6 61 23 45 67",
      "id": "wamid.POSTMAN-{{run_id}}-PHONE",
      "timestamp": "1759395600",
      "type": "text",
      "text": {
        "body": "Des nouvelles ?"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      (() => {
      pm.test("HTTP 201", () => { pm.response.to.have.status(201); });
      const data = pm.response.json();
      const m=data.message;
      pm.test("New message", () => { pm.expect(data.duplicate).to.eql(false); });
      pm.test("Correct dossier, method, and state", () => { pm.expect([m.dossier_reference,m.routing_method,m.routing_state]).to.deep.eql(["D-1234", "single_dossier", "attached"]); });
      pm.test("Fake analysis completed", () => { pm.expect(m.analysis.status).to.eql("completed");pm.expect(m.analysis.error).to.eql(null);pm.expect(m.analysis.result.confidence).to.eql(0.95); });
      pm.test("Normalized Moroccan phone", () => { pm.expect(m.sender).to.eql("+212661234567"); });
      pm.collectionVariables.set("id_PHONE",m.id);pm.collectionVariables.set("saved_PHONE",JSON.stringify(m));
      })();
    language: text/javascript
order: 13000
