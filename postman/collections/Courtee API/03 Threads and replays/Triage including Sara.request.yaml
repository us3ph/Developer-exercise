$kind: http-request
url: "{{base_url}}/triage"
method: GET
scripts:
  - type: afterResponse
    code: |-
      (() => {
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      const data = pm.response.json();
      pm.test("Four new triage entries", () => { const old=JSON.parse(pm.collectionVariables.get("base_triage"));const added=["C","E","F","J"].map(c=>Number(pm.collectionVariables.get("id_"+c)));pm.expect(data.messages.map(m=>m.id).sort((a,b)=>a-b)).to.deep.eql(old.concat(added).sort((a,b)=>a-b)); });
      pm.test("Every entry is unattached", () => { pm.expect(data.messages.every(m=>m.dossier_id===null)).to.eql(true); });
      pm.test("Newest messages first", () => { for(let i=1;i<data.messages.length;i++){const a=data.messages[i-1],b=data.messages[i];pm.expect(a.date>b.date || (a.date===b.date && a.id>b.id)).to.eql(true);} });
      })();
    language: text/javascript
order: 6000
