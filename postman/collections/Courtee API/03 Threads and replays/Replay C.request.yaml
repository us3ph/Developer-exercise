$kind: http-request
url: "{{base_url}}/webhooks/whatsapp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "from": "212662000111",
      "id": "wamid.POSTMAN-{{run_id}}-C",
      "timestamp": "1759395720",
      "type": "text",
      "text": {
        "body": "Avez-vous des nouvelles ?"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      (() => {
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      const data = pm.response.json();
      pm.test("Replay returns the saved message", () => { pm.expect(data.duplicate).to.eql(true);pm.expect(data.message).to.deep.eql(JSON.parse(pm.collectionVariables.get("saved_C"))); });
      })();
    language: text/javascript
order: 2000
