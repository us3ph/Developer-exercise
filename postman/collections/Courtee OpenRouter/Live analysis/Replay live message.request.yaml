$kind: http-request
url: "{{base_url}}/webhooks/email"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "to": [
        "d-2041@dossiers.courtee.ai"
      ],
      "from": "k.bennani@cihbank.ma",
      "subject": "[D-2041] Accord de principe",
      "text": "Bonjour, accord de principe pour 850 000 MAD sur 25 ans à 4,6 %.",
      "headers": {
        "Message-ID": "<POSTMAN-{{live_run_id}}-LIVE@demo.test>"
      },
      "attachments": []
    }
scripts:
  - type: afterResponse
    code: |-
      (() => {
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      const data = pm.response.json();
      pm.test("Replay reuses saved analysis", () => { pm.expect(data.duplicate).to.eql(true);pm.expect(data.message.analysis).to.deep.eql(JSON.parse(pm.collectionVariables.get("live_analysis")));pm.expect(data.message.proposals.find(p=>p.id===Number(pm.collectionVariables.get("live_proposal_id"))).status).to.eql("applied"); });
      })();
    language: text/javascript
order: 5000
