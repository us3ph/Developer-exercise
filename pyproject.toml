[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "courtee"
version = "0.1.0"
description = "Deterministic mortgage dossier message routing and controlled analysis"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
courtee = "courtee.cli:main"

[tool.setuptools.packages.find]
include = ["courtee*"]

[tool.setuptools.package-data]
courtee = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
